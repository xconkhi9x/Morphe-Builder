name: Sync Upstream

on:
  schedule:
    - cron: '0 0 * * 0' # Chạy hàng tuần tự sync code mới nhất từ repo gốc
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync upstream changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/subashbuilds/Morphe-Builder.git || true
          git fetch upstream
          git checkout main
          git merge upstream/main -m "chore: sync upstream changes" || true
          git push origin main || true
