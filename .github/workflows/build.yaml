name: Build (all enabled apps)

on:
  schedule:
    - cron: '0 0 1 * *' 
      timezone: Asia/Kolkata
  workflow_dispatch:
    inputs:
      force:
        description: 'Rebuild even if the resolved version was already released'
        type: boolean
        default: false

permissions:
  id-token: write
  contents: write
  attestations: write
  artifact-metadata: write

# Don't let two runs (e.g. a schedule tick + a manual retrigger) race each
# other and create overlapping/duplicate releases.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      flaresolverr:
        image: ghcr.io/flaresolverr/flaresolverr:latest
        env:
          DISABLE_MEDIA: true
          TZ: America/Los_Angeles
          LANG: en_US
        ports:
          - 8191:8191

    steps:
      - uses: actions/checkout@v4

      - name: Set up java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.13"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: Validate config.yml
        run: uv run main.py --check

      - name: Wait for FlareSolverr to be ready
        run: |
          for i in {1..30}; do
            if curl -s http://localhost:8191/health > /dev/null; then
              echo "FlareSolverr is ready"
              exit 0
            fi
            sleep 2
          done
          echo "FlareSolverr did not become ready in time"
          exit 1

      - name: Build + publish every enabled app
        id: try_building
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          TG_THREAD_ID: ${{ secrets.TG_THREAD_ID }}
          FLARESOLVERR_URL: http://localhost:8191
        run: |
          uv run main.py ${{ inputs.force && '--force' || '' }}

      - name: Send APKs and Notification to Discord
        if: steps.try_building.outputs.has_output == 'true'
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          if [ -z "$DISCORD_WEBHOOK" ]; then
            echo "DISCORD_WEBHOOK not set, skipping."
            exit 0
          fi
          echo "Sending notification and artifacts to Discord..."
          for file in $(find ./output -name "*.apk" 2>/dev/null); do
            [ -e "$file" ] || continue
            filename=$(basename "$file")
            filesize=$(stat -c%s "$file")
            if [ "$filesize" -le 25000000 ]; then
              echo "Uploading $filename to Discord..."
              curl -s -F "file=@$file" -F "content=📱 **Morphe Build:** `$filename`" "$DISCORD_WEBHOOK" || true
            else
              echo "File $filename is larger than 25MB, skipping direct attachment."
            fi
          done

          RELEASE_URL="https://github.com/${{ github.repository }}/releases"
          curl -s -H "Content-Type: application/json" -X POST -d '{"content": "✅ **Morphe Build Hoàn Tất!**\nCác bản cập nhật mới nhất đã được đẩy lên GitHub Releases:\n🔗 https://github.com/'"${{ github.repository }}"'/releases"}' "$DISCORD_WEBHOOK" || true

      - name: Generate Attestations
        if: steps.try_building.outputs.has_output == 'true'
        uses: actions/attest@v4.2.0
        with:
          subject-path: |
            ./output/**/*.apk
            ./output/**/*.zip
